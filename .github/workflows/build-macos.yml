name: Build Motive Social macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Motive-Social-macOS
          path: dist/Motive-Social-macOS.zip
          if-no-files-found: error
